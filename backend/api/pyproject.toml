[project]
name = "smart-scheduling-api"
version = "0.1.0"
description = "FastAPI backend scaffold for AI Smart Scheduling"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.0,<2.0.0",
  "fastapi[standard]>=0.124.0",
  "psycopg[binary]>=3.2.0,<4.0.0",
  "pydantic-settings>=2.7.0,<3.0.0",
  "sqlalchemy>=2.0.0,<3.0.0",
  "uvicorn[standard]>=0.38.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0,<1.0.0",
  "pytest>=8.0.0,<10.0.0",
  "ruff>=0.14.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"