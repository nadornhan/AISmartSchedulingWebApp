[project]
name = "smart-scheduling-api"
version = "0.1.0"
description = "FastAPI backend scaffold for AI Smart Scheduling"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.124.0",
  "uvicorn[standard]>=0.38.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.14.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
