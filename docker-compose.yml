services:
  api:
    build:
      context: .
      dockerfile: backend/api/Dockerfile
    ports:
      - '8000:8000'
    volumes:
      - ./backend/api/app:/app/app

  web:
    build:
      context: .
      dockerfile: frontend/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - '3000:3000'
    depends_on:
      - api
