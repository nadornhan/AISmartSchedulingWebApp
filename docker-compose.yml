services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_scheduling}
      POSTGRES_USER: ${POSTGRES_USER:-smart_scheduler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart_scheduler_dev}
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-smart_scheduler} -d ${POSTGRES_DB:-smart_scheduling}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: backend/api/Dockerfile
    command:
      [
        'sh',
        '-c',
        'python -m alembic upgrade heads && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload',
      ]
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql+psycopg://smart_scheduler:smart_scheduler_dev@postgres:5432/smart_scheduling}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    ports:
      - '8000:8000'
    volumes:
      - ./backend/api/app:/app/app
      - ./backend/api/alembic:/app/alembic
      - ./backend/api/alembic.ini:/app/alembic.ini
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  postgres-data:
